        /* Карточки оборудования: светящийся бордер, бегущий по периметру при наведении (только десктоп) */
        @property --equip-angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes equipGlowSpin { to { --equip-angle: 360deg; } }

        @media (min-width: 1024px) and (hover: hover) {
            .equip-glow::before,
            .equip-glow::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: inherit;
                padding: 2px;
                background: conic-gradient(from var(--equip-angle),
                    rgba(38, 205, 176, 0) 0deg,
                    rgba(38, 205, 176, 0) 185deg,
                    rgba(38, 205, 176, 0.55) 265deg,
                    #26cdb0 320deg,
                    #9df6e6 350deg,
                    #26cdb0 360deg);
                -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                -webkit-mask-composite: xor;
                mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
                mask-composite: exclude;
                opacity: 0;
                transition: opacity 0.35s ease;
                pointer-events: none;
                z-index: 20;
            }
            /* второй слой — размытая подсветка того же контура */
            .equip-glow::after {
                filter: blur(7px);
                z-index: 19;
            }
            .equip-glow:hover::before { opacity: 1; animation: equipGlowSpin 2.6s linear infinite; }
            .equip-glow:hover::after  { opacity: 0.75; animation: equipGlowSpin 2.6s linear infinite; }
        }
        @media (prefers-reduced-motion: reduce) {
            .equip-glow:hover::before,
            .equip-glow:hover::after { animation: none; }

        .news-content > *:last-child { margin-bottom: 0; }

        .dark .news-content h3 { color: #ffffff; }
        .news-content h4 {
            font-size: 1.05rem; font-weight: 700; color: #047857;
            margin: 2rem 0 0.75rem; padding-left: 0.85rem;
            border-left: 3px solid #10b981; line-height: 1.4;
        }
        .dark .news-content h4 { color: #34d399; }
        .news-content p { margin: 0 0 1.1rem; }
        .news-content ul, .news-content ol { margin: 0 0 1.25rem; padding-left: 1.5rem; }
        .news-content ul { list-style: disc; }
        .news-content ol { list-style: decimal; }
        .news-content li { margin-bottom: 0.55rem; padding-left: 0.2rem; }
        .news-content li::marker { color: #10b981; font-weight: 700; }
        .news-content strong, .news-content b { color: #0f172a; font-weight: 700; }
        .dark .news-content strong, .dark .news-content b { color: #ffffff; }
        .news-content em, .news-content i { font-style: italic; color: #64748b; }
        .dark .news-content em, .dark .news-content i { color: #94a3b8; }
        .news-content a { color: #059669; text-decoration: underline; text-underline-offset: 3px; word-break: break-word; }

        .news-content a:hover { opacity: 0.8; }
        .news-content blockquote {
            margin: 1.5rem 0; padding: 0.85rem 1.15rem;
            border-left: 3px solid #10b981; border-radius: 0 0.75rem 0.75rem 0;
            background: rgba(16, 185, 129, 0.07); font-style: italic; color: #475569;
        }
        .dark .news-content blockquote { background: rgba(16, 185, 129, 0.1); color: #cbd5e1; }
        .news-content hr { margin: 1.75rem 0; border: 0; border-top: 1px solid rgba(100, 116, 139, 0.25); }
        .news-content img { border-radius: 0.75rem; margin: 1.25rem 0; max-width: 100%; height: auto; }

        /* Кнопка AI-виджета: показывается не сразу (см. useEffect с классом aiw-visible).
           Панель самого виджета правилом не затрагивается — если чат открыт, он виден всегда. */
        .smit-aiw-btn {
            transition: opacity 0.35s ease, transform 0.35s ease, visibility 0.35s;
        }
        body:not(.aiw-visible) .smit-aiw-btn {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(14px) scale(0.9);
        }

        /* Матовое стекло карточек тарифов.
           Класс продублирован (.tariff-glass.tariff-glass) намеренно: у Tailwind-утилит
           на самой карточке та же специфичность, и без этого фон и тени сюда не доходят. */
        .tariff-glass.tariff-glass {
            backdrop-filter: blur(22px) saturate(170%);
            -webkit-backdrop-filter: blur(22px) saturate(170%);
            /* световой кант сверху — главный признак матового стекла */
            box-shadow: 0 8px 32px rgba(15, 23, 42, 0.10), inset 0 1px 0 rgba(255, 255, 255, 0.75);
        }
        .dark .tariff-glass.tariff-glass {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.14);
        }
        .tariff-glass.tariff-glass:hover {
            box-shadow: 0 20px 60px rgba(16, 185, 129, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.85);
        }
        .dark .tariff-glass.tariff-glass:hover {
            box-shadow: 0 20px 60px rgba(16, 185, 129, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        /* На мобильных фон страницы светлый и почти однородный, поэтому фон 60% читался
           как сплошная заливка. Делаем стекло заметно прозрачнее и добавляем блик по диагонали. */
        @media (max-width: 767px) {
            .tariff-glass.tariff-glass {
                background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.46) 0%,
                    rgba(255, 255, 255, 0.30) 48%,
                    rgba(236, 253, 245, 0.24) 100%);
                border-color: rgba(255, 255, 255, 0.80);
                backdrop-filter: blur(16px) saturate(185%);
                -webkit-backdrop-filter: blur(16px) saturate(185%);
                box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.95);
            }
            .dark .tariff-glass.tariff-glass {
                background: linear-gradient(135deg,
                    rgba(30, 41, 59, 0.46) 0%,
                    rgba(15, 23, 42, 0.30) 48%,
                    rgba(6, 78, 59, 0.26) 100%);
                border-color: rgba(255, 255, 255, 0.14);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.42), inset 0 1px 0 rgba(255, 255, 255, 0.16);
            }
        }

        /* Блик, пробегающий по кнопке при наведении */
        .btn-shine {
            position: absolute;
            top: 0; bottom: 0;
            left: -60%;
            width: 45%;
            pointer-events: none;
            background: linear-gradient(100deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.45) 50%,
                rgba(255,255,255,0) 100%);
            transform: translateX(0) skewX(-18deg);
            opacity: 0;
            will-change: transform;
        }
        .group:hover > .btn-shine,
        button:hover > .btn-shine {
            opacity: 1;
            animation: btnShine 0.85s ease-out;
        }
        /* сдвигаем через transform: 190% ширины кнопки при ширине блика 45% → ~422% собственной ширины */
        @keyframes btnShine {
            from { transform: translateX(0) skewX(-18deg); }
            to   { transform: translateX(422%) skewX(-18deg); }
        }
        @media (prefers-reduced-motion: reduce) {
            .group:hover > .btn-shine, button:hover > .btn-shine { animation: none; opacity: 0; }
        }

        /* Полноэкранные сайдбары на мобильных (карта покрытия, тест скорости): выезжают справа */
        @keyframes sheetInRight {
            from { transform: translateX(100%); }
            to   { transform: translateX(0); }
        }
        @media (max-width: 639px) {
            .sheet-right {
                animation: sheetInRight 0.34s cubic-bezier(0.32, 0.72, 0, 1) both;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .sheet-right { animation: none; }
        }

        /* Полноэкранная новость на мобильных: панель выезжает слева */
        @keyframes newsPanelInLeft {
            from { transform: translateX(-100%); }
            to   { transform: translateX(0); }
        }
        @media (max-width: 639px) {
            .news-modal-panel {

            .news-modal-panel { animation: none; }

        .news-scroll { scrollbar-width: thin; scrollbar-color: rgba(16, 185, 129, 0.55) transparent; }
        .news-scroll::-webkit-scrollbar { width: 10px; }

        .news-scroll::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #10b981, #059669);
            border: 2px solid transparent; background-clip: padding-box;
        }

        .glass-text { text-shadow: 0 2px 10px rgba(16, 185, 129, 0.1); }
        .addr-dropdown::-webkit-scrollbar { width: 4px; }
        .addr-dropdown::-webkit-scrollbar-track { background: transparent; }
        .addr-dropdown::-webkit-scrollbar-thumb { background: rgba(16, 185, 129, 0.45); border-radius: 10px; }
        .addr-dropdown::-webkit-scrollbar-thumb:hover { background: rgba(16, 185, 129, 0.75); }

        /* Logo hover animation */
        .logo-hover {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), filter 0.3s ease;

        .logo-hover:hover {
            transform: scale(1.05);

        }
        .logo-hover:hover .logo-text {
            background: linear-gradient(135deg, #10b981, #14b8a6, #0d9488);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-icon {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s ease;
        }
        .logo-text {
            transition: all 0.3s ease;
        }
        
        /* Кастомный скроллбар для модальных окон */
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Dark mode scrollbar */

        .dark .custom-scroll::-webkit-scrollbar-thumb:hover { background: #64748b; }

        #error-display { padding: 20px; color: red; font-family: monospace; display: none; }
    </style>

            };

            const {
                Menu, X, Check, Phone, User, CreditCard,
                Wifi, Monitor, Shield, Zap, Download,
                MapPin, Clock, Mail, ChevronRight, ChevronLeft, ChevronDown, Server,
                MousePointer, ArrowRight, FileText,
                Tv, Cpu, HardDrive, Bot, File, Cookie, Settings, Moon, Sun,
                Mic, Square, Loader2, ClipboardList, Play
            } = Icons;

            // Expose icons for external widget script
            window._SmitIcons = Icons;

            // --- 3D ФОН (CANVAS) ---
            const GeometricBackground = ({ isDark }) => {
                const canvasRef = useRef(null);
                
                useEffect(() => {
                    const canvas = canvasRef.current;
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    let animationFrameId;

                    let width = window.innerWidth;
                    let height = window.innerHeight;

                    const nodes = [];
                    const nodeCount = 50; 
                    const connectionDistance = 300; 
                    const perspective = 800;
                    
                    // целевые значения от ввода и сглаженные, к которым подтягивается сцена:
                    // без этого при резкой прокрутке или рывке мышью сетка дёргается
                    let targetMouseX = 0, targetMouseY = 0;
                    let mouseX = 0, mouseY = 0;
                    let targetScrollY = 0, scrollY = 0;

                    // сила каждой связи (0..1). Меняется плавно, поэтому линии
                    // не вспыхивают и не гаснут скачком на пороге расстояния
                    const linkStrength = new Float32Array(nodeCount * nodeCount);
                    const LINK_EASE = 0.055;   // скорость перетекания связей
                    const INPUT_EASE = 0.06;   // скорость реакции на мышь и прокрутку

                    const handleResize = () => {
                        width = window.innerWidth;
                        height = window.innerHeight;
                        canvas.width = width;
                        canvas.height = height;
                    };
                    window.addEventListener('resize', handleResize);
                    handleResize();

                    const handleMouseMove = (e) => {
                        targetMouseX = (e.clientX - width / 2) * 0.0005;
                        targetMouseY = (e.clientY - height / 2) * 0.0005;
                    };
                    window.addEventListener('mousemove', handleMouseMove, { passive: true });

                    const handleScroll = () => {
                        targetScrollY = window.scrollY;
                    };
                    window.addEventListener('scroll', handleScroll, { passive: true });

                    class NetworkNode {
                        constructor() {
                            this.x = (Math.random() - 0.5) * width * 1.5;
                            this.y = (Math.random() - 0.5) * height * 1.5;
                            this.z = (Math.random() - 0.5) * 1000;
                            this.vx = (Math.random() - 0.5) * 0.3; 
                            this.vy = (Math.random() - 0.5) * 0.3;
                            this.vz = (Math.random() - 0.5) * 0.3;
                            this.size = Math.random() * 3 + 2; 
                            this.color = Math.random() > 0.5 ? '#059669' : '#10b981'; 
                        }

                        rotate(x, y, z, rX, rY) {
                            let dy = y * Math.cos(rX) - z * Math.sin(rX);
                            let dz = y * Math.sin(rX) + z * Math.cos(rX);
                            y = dy;
                            z = dz;
                            let dx = x * Math.cos(rY) - z * Math.sin(rY);
                            dz = x * Math.sin(rY) + z * Math.cos(rY);
                            x = dx;
                            z = dz;
                            return {x, y, z};
                        }

                        project(x, y, z) {
                            const scale = perspective / (perspective + z + 1000);
                            return {
                                x: width / 2 + x * scale,
                                y: height / 2 + y * scale,
                                scale: scale,
                                z: z 
                            };
                        }

                        update(rotationX, rotationY, scrollFactor) {
                            this.x += this.vx;
                            this.y += this.vy;
                            this.z += this.vz;
                            // Boundary checks
                            const limit = 1000;
                            if (this.x > limit) this.x = -limit;
                            if (this.x < -limit) this.x = limit;
                            if (this.y > limit) this.y = -limit;
                            if (this.y < -limit) this.y = limit;
                            if (this.z > limit) this.z = -limit;
                            if (this.z < -limit) this.z = limit;

                            const currentRX = rotationX + scrollFactor * 0.0005;
                            const currentRY = rotationY + scrollFactor * 0.0005;
                            
                            const rotated = this.rotate(this.x, this.y, this.z, currentRX, currentRY);
                            return this.project(rotated.x, rotated.y, rotated.z);
                        }
                    }

                    // Initialize nodes
                    for(let i = 0; i < nodeCount; i++) {
                        nodes.push(new NetworkNode());
                    }

                    let globalRotationX = 0;
                    let globalRotationY = 0;

                    const render = () => {
                        ctx.clearRect(0, 0, width, height);
                        
                        globalRotationX += 0.0005;
                        globalRotationY += 0.0005;

                        // догоняем ввод постепенно: сцена реагирует мягко, без рывков
                        mouseX += (targetMouseX - mouseX) * INPUT_EASE;
                        mouseY += (targetMouseY - mouseY) * INPUT_EASE;
                        scrollY += (targetScrollY - scrollY) * INPUT_EASE;

                        const rX = globalRotationX + mouseY;
                        const rY = globalRotationY + mouseX;

                        const projectedNodes = nodes.map(node => ({
                            ...node.update(rX, rY, scrollY),
                            ref: node 
                        }));

                        ctx.lineWidth = 1.2;
                        for (let i = 0; i < projectedNodes.length; i++) {
                            const p1 = projectedNodes[i];

                            for (let j = i + 1; j < projectedNodes.length; j++) {
                                const p2 = projectedNodes[j];
                                const k = i * nodeCount + j;

                                // цель: 1 — узлы рядом, 0 — разошлись или ушли за камеру
                                let target = 0;
                                if (p1.scale > 0 && p2.scale > 0) {
                                    const dx = p1.x - p2.x;
                                    const dy = p1.y - p2.y;
                                    const dist = Math.sqrt(dx * dx + dy * dy);
                                    const maxDist = connectionDistance * p1.scale;
                                    if (dist < maxDist) target = 1 - dist / maxDist;
                                }

                                // связь перетекает к цели, а не переключается мгновенно
                                const cur = linkStrength[k] + (target - linkStrength[k]) * LINK_EASE;
                                linkStrength[k] = cur;

                                if (cur < 0.012) continue;   // почти погасшие линии не рисуем

                                ctx.beginPath();
                                ctx.moveTo(p1.x, p1.y);
                                ctx.lineTo(p2.x, p2.y);
                                ctx.strokeStyle = isDark
                                    ? `rgba(52, 211, 153, ${cur * 0.4})`
                                    : `rgba(5, 150, 105, ${cur * 0.6})`;
                                ctx.stroke();
                            }
                        }

                        for (let i = 0; i < projectedNodes.length; i++) {
                            const p1 = projectedNodes[i];
                            if (p1.scale < 0) continue;
                            ctx.beginPath();
                            ctx.arc(p1.x, p1.y, p1.ref.size * p1.scale, 0, Math.PI * 2);
                            ctx.fillStyle = p1.ref.color;
                            // Add glow for dark mode
                            if (isDark) {
                                ctx.shadowBlur = 10;
                                ctx.shadowColor = p1.ref.color;
                            } else {
                                ctx.shadowBlur = 0;
                            }
                            ctx.globalAlpha = 0.9; 
                            ctx.fill();
                            ctx.shadowBlur = 0; // Reset
                        }
                        
                        ctx.globalAlpha = 1;
                        animationFrameId = requestAnimationFrame(render);
                    };

                    render();

                    return () => {
                        window.removeEventListener('resize', handleResize);
                        window.removeEventListener('mousemove', handleMouseMove);
                        window.removeEventListener('scroll', handleScroll);
                        cancelAnimationFrame(animationFrameId);
                    };
                }, [isDark]);

                return (
                    <canvas 
                        ref={canvasRef} 
                        className="fixed top-0 left-0 w-full h-full -z-10 pointer-events-none bg-slate-50 dark:bg-slate-950 transition-colors duration-500"
                    />
                );
            };

            // --- КОМПОНЕНТЫ UI ---
            const Button = ({ children, primary, className = "", onClick, icon: Icon }) => (
                <button 
                    onClick={onClick}
                    className={`
                        relative overflow-hidden group px-6 py-3 rounded-xl font-semibold transition-all duration-300 transform hover:-translate-y-1 hover:shadow-lg flex items-center gap-2
                        ${primary 
                            ? 'bg-gradient-to-r from-emerald-500 to-teal-400 text-white shadow-emerald-500/30' 
                            : 'bg-white/80 dark:bg-slate-800/80 backdrop-blur-md text-slate-700 dark:text-slate-200 border border-white/50 dark:border-slate-700/50 hover:bg-white dark:hover:bg-slate-700'}
                        ${className}
                    `}
                >
                    <div className="absolute inset-0 w-full h-full bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 pointer-events-none"></div>
                    {/* пробегающий блик при наведении */}
                    <span className="btn-shine" aria-hidden="true"></span>
                    {Icon && <Icon size={18} />}
                    {children}
                </button>
            );

            const GlassCard = ({ children, className = "", hoverEffect = true, animateIn = false, onClick, style }) => (
                <div 
                    onClick={onClick}
                    style={style}
                    className={`
                        backdrop-blur-xl bg-white/60 dark:bg-slate-800/50 border border-white/60 dark:border-slate-700/50 rounded-2xl p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)]
                        text-slate-800 dark:text-slate-100
                        ${hoverEffect ? 'transition-all duration-300 hover:shadow-[0_8px_30px_rgba(16,185,129,0.15)] hover:bg-white/80 dark:hover:bg-slate-800/80 hover:-translate-y-2' : ''}
                        ${animateIn ? 'animate-in fade-in slide-in-from-bottom-4 duration-700 fill-mode-backwards' : ''}
                        ${className}
                        ${animateIn ? 'gsap-card' : ''} 
                    `}
                >
                    {children}
                </div>
            );

            const Badge = ({ children }) => (
                <span className="inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-100 text-emerald-700 border border-emerald-200 dark:bg-emerald-900/30 dark:text-emerald-400 dark:border-emerald-800 mb-2">
                    {children}
                </span>
            );

            // --- ОБЛОЖКА ТАРИФА: постер → зацикленное видео (наведение на десктопе, попадание в фокус на мобильном) ---
            const TariffMedia = ({ cover, video, coverDark, videoDark, theme, title }) => {
                const videoRef = useRef(null);
                const wrapRef = useRef(null);
                const [playing, setPlaying] = useState(false);
                // touch-устройство определяем один раз: на нём нет hover, включаем сценарий «в фокусе»
                const [isTouch] = useState(() =>
                    typeof window !== 'undefined' && window.matchMedia('(hover: none)').matches
                );

                const isDark = theme === 'dark';
                const posterSrc = (isDark && coverDark) ? coverDark : cover;
                const videoSrc = (isDark && videoDark) ? videoDark : video;

                // на 2G и при включённой экономии трафика ролик не тянем — остаётся постер
                const canPlayVideo = () => {
                    const c = navigator.connection;
                    if (!c) return true;
                    if (c.saveData) return false;
                    return !/(^|\-)2g$/.test(c.effectiveType || '');
                };

                const play = () => {
                    const v = videoRef.current;
                    if (!v || !canPlayVideo()) return;
                    const p = v.play();
                    if (p && p.then) p.then(() => setPlaying(true)).catch(() => {});
                    else setPlaying(true);
                };
                const stop = () => {
                    const v = videoRef.current;
                    if (!v) return;
                    v.pause();
                    v.currentTime = 0;
                    setPlaying(false);
                };

                // при смене темы подменяем источник и сбрасываем воспроизведение
                useEffect(() => { stop(); }, [videoSrc]);

                // мобильные: играет тот ролик, который сейчас в фокусе экрана
                useEffect(() => {
                    if (!isTouch || !wrapRef.current || !('IntersectionObserver' in window)) return;
                    const io = new IntersectionObserver((entries) => {
                        entries.forEach((e) => {
                            if (e.intersectionRatio >= 0.55) play();
                            else stop();
                        });
                    }, { threshold: [0, 0.55, 1] });
                    io.observe(wrapRef.current);
                    return () => io.disconnect();
                }, [isTouch]);

                if (!posterSrc) return null;

                return (
                    <div
                        ref={wrapRef}
                        className="relative -mx-6 -mt-6 mb-5 aspect-video overflow-hidden rounded-t-2xl bg-slate-100 dark:bg-slate-900"
                        onMouseEnter={isTouch ? undefined : play}
                        onMouseLeave={isTouch ? undefined : stop}
                    >
                        <img
                            src={posterSrc}
                            alt={title}
                            loading="lazy"
                            className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${playing ? 'opacity-0' : 'opacity-100'}`}
                        />
                        {videoSrc && (
                            <video
                                ref={videoRef}
                                src={videoSrc}
                                muted
                                loop
                                playsInline
                                preload="none"
                                aria-hidden="true"
                                className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-500 ${playing ? 'opacity-100' : 'opacity-0'}`}
                            />
                        )}
                        {/* подсказка «наведите» — только на десктопе и только пока ролик не играет */}
                        {videoSrc && !isTouch && (
                            <div className={`absolute bottom-2 right-2 flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-900/55 backdrop-blur-sm text-white text-[11px] font-medium transition-opacity duration-300 pointer-events-none ${playing ? 'opacity-0' : 'opacity-0 group-hover:opacity-100'}`}>
                                <Play size={10} className="fill-white" /> видео
                            </div>
                        )}
                    </div>
                );
            };

            // --- NOTICE MODAL: динамический рендеринг блоков из aida.smit34.ru/modal-config ---
            function renderNoticeBlocks(blocks) {
                if (!blocks || !blocks.length) return null;
                return blocks.map(function(block, i) {
                    switch (block.type) {
                        case 'paragraph':
                            return React.createElement('p', { key: i, className: 'text-slate-600 dark:text-slate-300 text-sm', dangerouslySetInnerHTML: { __html: block.text } });
                        case 'heading':
                            return React.createElement('div', { key: i, className: 'border-l-4 border-emerald-500 pl-3 py-1 bg-emerald-50/50 dark:bg-emerald-900/20 rounded-r-lg' },
                                React.createElement('h5', { className: 'font-bold text-slate-800 dark:text-slate-100 text-sm mb-1 uppercase tracking-wide', dangerouslySetInnerHTML: { __html: block.text } })
                            );
                        case 'separator':
                            return React.createElement('hr', { key: i, className: 'border-slate-200 dark:border-slate-700 my-4' });
                        case 'list':
                            return React.createElement('ul', { key: i, className: 'list-disc list-inside text-slate-600 dark:text-slate-300 text-sm space-y-1' },
                                (block.items || []).map(function(item, j) {
                                    return React.createElement('li', { key: j, dangerouslySetInnerHTML: { __html: item } });
                                })
                            );
                        case 'html':
                            return React.createElement('div', { key: i, dangerouslySetInnerHTML: { __html: block.html } });
                        case 'footer':
                            return React.createElement('p', { key: i, className: 'text-center text-slate-400 dark:text-slate-500 text-xs italic mt-6', dangerouslySetInnerHTML: { __html: block.text } });
                        default:

                                // Анимируем содержимое, а не саму <section>: секция целиком с opacity:0
                                // мигает при перерисовке и портит первое впечатление от блока.
                                gsap.utils.toArray('.gsap-section').forEach((section) => {
                                    const heading = section.querySelector('h2');
                                    if (!heading) return;
                                    const holder = heading.parentElement;
                                    const lead = holder ? holder.querySelector('p') : null;
                                    const badge = holder ? holder.querySelector('span, .inline-block') : null;
                                    const items = [badge, heading, lead].filter(Boolean);

                                        y: 32,
                                        autoAlpha: 0,
                                        duration: 0.75,
                                        ease: 'power3.out',
                                        stagger: 0.12,
                                        clearProps: 'opacity,visibility,transform',
                                        scrollTrigger: { trigger: section, start: 'top 78%', once: true }
                                    });
                                });

                                // --- КАРТОЧКИ ---
                                // batch собирает все карточки, попавшие в кадр примерно одновременно,
                                // и запускает их одной волной со сдвигом — вместо N независимых триггеров.
                                ScrollTrigger.batch('.gsap-card', {
                                    start: 'top 88%',
                                    once: true,
                                    // clearProps убирает inline-стили после анимации: иначе,
                                    // если твин прервётся, элемент застрянет на промежуточной прозрачности
                                    onEnter: (batch) => gsap.from(batch, {
                                        y: 44,
                                        autoAlpha: 0,
                                        duration: 0.7,
                                        ease: 'power3.out',
                                        stagger: 0.1,
                                        clearProps: 'opacity,visibility,transform'

                                    });
                                });
                            });
                        }

                                            {activeDoc === 'privacy' ? 'Политика конфиденциальности' : 'Пользовательское соглашение'}
                                        </h2>
                                        <button 
                                            onClick={() => setActiveDoc(null)}
                                            className="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-full transition-colors"
                                        >
                                            <X size={24} />
                                        </button>
                                    </div>
                                    
                                    <div className="flex-1 overflow-y-auto p-6 sm:p-10 custom-scroll text-slate-800 dark:text-slate-200">
                                        {activeDoc === 'privacy' ? privacyPolicyText : userAgreementText}
                                    </div>
                                    
                                    {/* Footer removed as requested */}
                                </div>
                            </div>
                        )}

                        {/* VOICE AI ASSISTANT */}
                        <AIWidget />

                        {/* COOKIE CONSENT */}
                        {showCookieConsent && (
                            <div className="fixed bottom-6 left-6 z-[90] max-w-sm w-full animate-in slide-in-from-bottom-4 duration-500">
                                <div className="relative rounded-2xl overflow-hidden"
                                    style={{
                                        background: 'rgba(255,255,255,0.18)',
                                        backdropFilter: 'blur(24px)',
                                        WebkitBackdropFilter: 'blur(24px)',
                                        border: '1px solid rgba(255,255,255,0.35)',
                                        boxShadow: '0 8px 32px rgba(0,0,0,0.18), inset 0 1px 0 rgba(255,255,255,0.5)'
                                    }}>
                                    {/* Градиентный блик сверху */}
                                    <div className="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-white/60 to-transparent"></div>
                                    <div className="p-5 flex items-start gap-4">
                                        <div className="p-2.5 rounded-xl shrink-0"
                                            style={{ background: 'rgba(16,185,129,0.15)', backdropFilter: 'blur(8px)', border: '1px solid rgba(16,185,129,0.25)' }}>
                                            <Cookie size={22} className="text-emerald-500 dark:text-emerald-400" />
                                        </div>
                                        <div>
                                            <h4 className="font-bold text-slate-800 dark:text-white mb-1.5 text-sm">Мы используем файлы cookie</h4>
                                            <p className="text-xs text-slate-600 dark:text-slate-300 mb-3 leading-relaxed">
                                                Для корректной работы сайта и анализа трафика. Продолжая, вы соглашаетесь с нашей <button onClick={() => setActiveDoc('privacy')} className="text-emerald-600 dark:text-emerald-400 hover:underline">политикой</button>.
                                            </p>
                                            <button onClick={handleAcceptCookies}
                                                className="px-4 py-1.5 text-xs font-semibold text-white rounded-lg transition-all"
                                                style={{ background: 'linear-gradient(135deg, #10b981, #059669)', boxShadow: '0 2px 8px rgba(16,185,129,0.4)' }}>
                                                Хорошо
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        
        } catch (err) {
            console.error(err);
            document.getElementById('error-display').innerText = "Ошибка запуска сайта: " + err.message + "\n\nПожалуйста, проверьте консоль разработчика (F12) для подробностей.";
            document.getElementById('error-display').style.display = 'block';
        }
    </script>
</body>
</html>
